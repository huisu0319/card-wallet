<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>CARD WALLET — 명함 지갑</title>
<meta name="theme-color" content="#1a1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Wallet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="app">

  <!-- ===== 앱바 ===== -->
  <header class="appbar">
    <div class="appbar-row">
      <h1 class="logo">CARD <span>WALLET<i>.</i></span></h1>
      <div class="appbar-btns">
        <button id="searchToggle" class="icon-btn" aria-label="검색">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button id="moreToggle" class="icon-btn" aria-label="더보기">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" class="fill"/><circle cx="12" cy="12" r="1.6" class="fill"/><circle cx="19" cy="12" r="1.6" class="fill"/></svg>
        </button>
      </div>
    </div>
    <div id="searchWrap" class="searchwrap" hidden>
      <input id="search" class="search" type="search" placeholder="이름 · 회사 · 태그 검색" autocomplete="off">
    </div>
    <div id="moreMenu" class="more-menu" hidden>
      <button id="exportBtn" class="menu-item">JSON으로 백업하기</button>
      <button id="importBtn" class="menu-item">백업 파일 불러오기</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
  </header>

  <!-- ===== 본문 ===== -->
  <main class="screen" id="screen">
    <p class="counter"><b id="count">0</b>장 보관 중</p>

    <section id="walletView" class="view">
      <div class="wallet">
        <div class="wallet-body"></div>
        <div class="wallet-inner"><div id="stack" class="stack"></div></div>
        <div class="wallet-pocket"><span class="pocket-label">CARD WALLET · SINCE 2026</span></div>
      </div>
      <p class="hint">명함을 탭하면 지갑에서 뽑아 볼 수 있어요</p>
    </section>

    <section id="gridView" class="view" hidden>
      <div id="grid" class="grid"></div>
    </section>

    <div id="empty" class="empty" hidden>
      <p class="empty-big">지갑이 비어 있어요<i>.</i></p>
      <p class="empty-sub">받은 명함을 기록하면<br>랜덤 디자인으로 만들어 드려요.</p>
      <button class="btn-primary" data-add>첫 명함 추가하기</button>
    </div>
  </main>

  <!-- ===== 하단 탭바 ===== -->
  <nav class="tabbar">
    <button class="tab is-on" data-tab="wallet">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 11h18"/></svg>
      <span>지갑</span>
    </button>
    <button id="addBtn" class="fab" aria-label="명함 추가">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="grid">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="4.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="14.5" width="7" height="5" rx="1.6"/><rect x="13.5" y="14.5" width="7" height="5" rx="1.6"/></svg>
      <span>전체</span>
    </button>
  </nav>

  <!-- ===== 명함 상세 (뽑기 인터랙션) ===== -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar">
      <button id="viewerClose" class="icon-btn light" aria-label="닫기">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span id="vName" class="viewer-name"></span>
      <span class="icon-btn light" aria-hidden="true"></span>
    </div>

    <div class="viewer-stage">
      <div id="vCard" class="vcard">
        <div id="flipper" class="flipper">
          <div class="flip-face flip-front" id="vFront"></div>
          <div class="flip-face flip-back" id="vBack"></div>
        </div>
      </div>
      <p class="viewer-tip">카드를 탭하면 뒤집혀요 · 아래로 밀면 지갑에 다시 넣어요</p>
    </div>

    <div class="viewer-actions">
      <button id="flipBtn" class="act"><svg viewBox="0 0 24 24"><path d="M4 8a8 8 0 0113.7-5.6M20 16a8 8 0 01-13.7 5.6"/><path d="M4 3v5h5M20 21v-5h-5"/></svg><span>뒤집기</span></button>
      <button id="recolorBtn" class="act"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 2.2 2.2 0 001.6-3.7 2.2 2.2 0 011.6-3.7H18a3 3 0 003-3c0-4.1-4-7.6-9-7.6z"/><circle cx="7.5" cy="11" r="1.1" class="fill"/><circle cx="11" cy="7.5" r="1.1" class="fill"/><circle cx="15.5" cy="9" r="1.1" class="fill"/></svg><span>디자인</span></button>
      <button id="editBtn" class="act"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><span>수정</span></button>
      <button id="deleteBtn" class="act danger"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg><span>삭제</span></button>
    </div>
  </div>

  <!-- ===== 입력 시트 ===== -->
  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-scrim" id="sheetScrim"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true">
      <div class="grabber"></div>
      <h2 id="sheetTitle">명함 기록하기</h2>
      <form id="form">
        <label class="f"><span>이름 <i>*</i></span><input name="name" required maxlength="24" placeholder="홍길동"></label>
        <label class="f"><span>회사</span><input name="company" maxlength="40" placeholder="주식회사 파워하우스"></label>
        <div class="f-row">
          <label class="f"><span>직함 · 부서</span><input name="title" maxlength="40" placeholder="브랜드 디자이너"></label>
          <label class="f"><span>받은 날짜</span><input name="date" type="date"></label>
        </div>
        <label class="f"><span>연락처</span><input name="phone" type="tel" inputmode="tel" maxlength="30" placeholder="010-0000-0000"></label>
        <label class="f"><span>메일 주소</span><input name="email" type="email" inputmode="email" maxlength="60" placeholder="hello@company.com"></label>
        <label class="f"><span>태그 <small>쉼표로 구분</small></span><input name="tags" maxlength="80" placeholder="디자인, 협업제안"></label>
        <label class="f"><span>메모</span><textarea name="memo" rows="2" maxlength="200" placeholder="어디서 만났는지, 무슨 이야기를 했는지"></textarea></label>
        <div class="sheet-actions">
          <button type="button" id="cancelBtn" class="btn-ghost">취소</button>
          <button type="submit" class="btn-primary" id="submitBtn">지갑에 넣기</button>
        </div>
      </form>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
